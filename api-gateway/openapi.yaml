openapi: 3.0.0
info:
  title: RaceStats API Gateway
  description: Central API Gateway for RaceStats microservices architecture
  version: 1.0.0
  contact:
    name: RaceStats Team

servers:
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Health
    description: Service health checks
  - name: Python API
    description: FastAPI backend endpoints (proxied)
  - name: Node API
    description: Node.js backend endpoints (proxied)

paths:
  /health:
    get:
      summary: Gateway health check
      description: Check if the API Gateway is running
      tags:
        - Health
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: API Gateway

  /api/python/drivers:
    get:
      summary: Get all F1 drivers
      description: Proxied to FastAPI backend - Returns all drivers from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/teams:
    get:
      summary: Get all F1 teams
      description: Proxied to FastAPI backend - Returns all teams from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/races:
    get:
      summary: Get all F1 races
      description: Proxied to FastAPI backend - Returns all races from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of races
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/circuits:
    get:
      summary: Get all F1 circuits
      description: Proxied to FastAPI backend - Returns all circuits from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of circuits
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/cars:
    get:
      summary: Get all F1 cars
      description: Proxied to FastAPI backend - Returns all cars from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/championships:
    get:
      summary: Get all championships
      description: Proxied to FastAPI backend - Returns all championships from MongoDB
      tags:
        - Python API
      responses:
        '200':
          description: List of championships
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/auth/login:
    post:
      summary: User login
      description: Proxied to FastAPI backend - Authenticate user
      tags:
        - Python API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object

  /api/python/auth/register:
    post:
      summary: User registration
      description: Proxied to FastAPI backend - Register new user
      tags:
        - Python API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object

  /api/python/favorites:
    post:
      summary: Create favorite
      description: Proxied to FastAPI backend - Add entity to favorites
      tags:
        - Python API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                entity_type:
                  type: string
                entity_id:
                  type: string
      responses:
        '201':
          description: Favorite created
          content:
            application/json:
              schema:
                type: object

  /api/python/favorites/user/{user_id}:
    get:
      summary: Get user favorites
      description: Proxied to FastAPI backend - Returns all favorites for a user
      tags:
        - Python API
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of favorites
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/python/comparisons:
    post:
      summary: Create comparison
      description: Proxied to FastAPI backend - Save entity comparison
      tags:
        - Python API
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                entity_type:
                  type: string
                entity_ids:
                  type: string
      responses:
        '201':
          description: Comparison created
          content:
            application/json:
              schema:
                type: object

  /api/python/comparisons/user/{user_id}:
    get:
      summary: Get user comparisons
      description: Proxied to FastAPI backend - Returns all comparisons for a user
      tags:
        - Python API
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of comparisons
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/node/health:
    get:
      summary: Node.js service health check
      description: Proxied to Node.js backend - Check service status
      tags:
        - Node API
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/node/scrape/news:
    get:
      summary: Get F1 news
      description: Proxied to Node.js backend - Scrape latest F1 news articles
      tags:
        - Node API
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of news items to return
      responses:
        '200':
          description: F1 news articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                        date:
                          type: string
                        image:
                          type: string
                  count:
                    type: integer

  /api/node/scrape/news/racefans:
    get:
      summary: Get RaceFans news
      description: Proxied to Node.js backend - Scrape latest RaceFans articles
      tags:
        - Node API
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: Number of news items to return
      responses:
        '200':
          description: RaceFans news articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  news:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                        url:
                          type: string
                        date:
                          type: string
                        image:
                          type: string
                  count:
                    type: integer

  /api/node/scrape/team/{teamName}:
    get:
      summary: Scrape team data
      description: Proxied to Node.js backend - Get enriched team data from external sources
      tags:
        - Node API
      parameters:
        - name: teamName
          in: path
          required: true
          schema:
            type: string
          description: Team name (e.g., "Red Bull Racing")
      responses:
        '200':
          description: Enriched team data
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Team not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/node/scrape/driver/{driverName}:
    get:
      summary: Scrape driver data
      description: Proxied to Node.js backend - Get enriched driver data from external sources
      tags:
        - Node API
      parameters:
        - name: driverName
          in: path
          required: true
          schema:
            type: string
          description: Driver name (e.g., "Max Verstappen")
      responses:
        '200':
          description: Enriched driver data
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/node/scrape/car/{teamName}/{year}:
    get:
      summary: Scrape car data
      description: Proxied to Node.js backend - Get enriched car data from external sources
      tags:
        - Node API
      parameters:
        - name: teamName
          in: path
          required: true
          schema:
            type: string
          description: Team name (e.g., "Red Bull Racing")
        - name: year
          in: path
          required: true
          schema:
            type: integer
          description: Year (e.g., 2023)
      responses:
        '200':
          description: Enriched car data
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Car not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
